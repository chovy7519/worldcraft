name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic PCG tests
        run: npm test
      - name: Build standalone offline HTML
        run: npm run build
      - name: Check standalone output
        run: test -s worldcraft.html
